<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>hyperautomation-simulator</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b0764"/>
      <stop offset="1" stop-color="#1e0a45"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tile)"/>
  <!-- Dynamic simulation loop -->
  <path d="M 256,256 C 210,168 120,168 120,256 C 120,344 210,344 256,256 C 302,168 392,168 392,256 C 392,344 302,344 256,256 Z" fill="none" stroke="#c084fc" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Three simulation nodes: labor, ai, capital -->
  <circle cx="120" cy="256" r="34" fill="#f43f5e"/>
  <circle cx="120" cy="256" r="16" fill="#ffffff"/>
  <circle cx="256" cy="256" r="38" fill="#fbbf24"/>
  <circle cx="256" cy="256" r="18" fill="#ffffff"/>
  <circle cx="392" cy="256" r="34" fill="#38bdf8"/>
  <circle cx="392" cy="256" r="16" fill="#ffffff"/>
</svg>\n